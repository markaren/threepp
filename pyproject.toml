# Python packaging for the `threepp` extension module. Builds the pybind11
# bindings (GL backend) into a self-contained wheel via scikit-build-core, which
# drives the existing CMake build.
#
#   pip install .                      # build + install from source
#   pip wheel . --no-deps -w dist      # build a redistributable wheel
#
# What's in the wheel: the GL renderer, CPU PhysX physics (PhysxWorld,
# articulations, the proprioceptive sensors) and the Vulkan deferred renderer
# with its G-buffer AOVs. Both extras are found QUIET-optionally at configure
# time, so nothing here requires them: the CI wheels provide the SDKs via
# CMAKE_ARGS hints (see .github/workflows/wheels.yml), while a bare
# `pip install` from the sdist on a machine with neither still builds, GL-only.
#
# Vulkan degrades gracefully at runtime: the loader is delay-loaded on Windows
# and auditwheel-vendored on Linux, so `import threepp` works on machines with
# no Vulkan runtime and threepp.vulkan_available() reports the truth;
# VulkanRenderer raises a clean RuntimeError there.
#
# NOT in the wheel, by design: GPU physics runtime (PhysXGpu_64.dll is 76 MB
# zipped against PyPI's 100 MiB/file cap). It is dlopen'd, never linked — drop
# PhysXGpu_64.dll + PhysXDevice64.dll next to the installed module and
# PhysxWorld(gpu_dynamics=True) / direct-GPU RL work (verified); soft bodies
# additionally need a binding surface the wheel does not have yet.
[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "threepp"
version = "0.1.0"
description = "three.js-style 3D scene authoring and rendering for Python (OpenGL + Vulkan deferred rendering, headless render-to-numpy, G-buffer AOVs, PhysX rigid-body physics)"
readme = "python/README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Lars Ivar Hatledal", email = "laht@ntnu.no" }]
keywords = ["3d", "graphics", "opengl", "rendering", "threejs", "scene-graph", "visualization", "robotics", "synthetic-data", "physics", "physx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: OS Independent",
]
dependencies = ["numpy"]

# `pip install threepp[rl]` adds the owned PPO trainer's dependency. (GpuSim
# itself additionally requires a PhysX-enabled source build.)
#
# `threepp[editor]` pulls the scene-editor application (its own package,
# `pip install threepp-editor` works just as well). UNPINNED on purpose: the
# CI version step rewrites only this file's `version =` line, so a `==` pin
# here would forever point at a version that never ships — the two packages
# stay in lockstep by being tagged together, not by metadata. The sys_platform
# marker makes the extra a no-op on Linux/macOS rather than an install error:
# editor wheels are Windows-only today (the exe embeds CPython, and
# libpython-linking executables sit outside manylinux practice).
[project.optional-dependencies]
rl = ["torch"]
editor = ["threepp-editor; sys_platform == 'win32'"]
full = ["threepp[rl,editor]"]

[project.urls]
Homepage = "https://github.com/markaren/threepp"
Source = "https://github.com/markaren/threepp"

[tool.scikit-build]
minimum-version = "0.10"
# Build only the Python module (and its deps), not the C++ examples/tests, and
# install only the package files (the python_module component from CMake).
build.targets = ["threepp_py"]
install.components = ["python_module"]
wheel.packages = []
cmake.version = ">=3.21"
cmake.args = [
    "-DTHREEPP_WITH_PYTHON=ON",
    "-DTHREEPP_BUILD_EXAMPLES=OFF",
    "-DTHREEPP_BUILD_TESTS=OFF",
    "-DTHREEPP_WITH_AUDIO=OFF",
    "-DPYBIND11_FINDPYTHON=ON",
]
