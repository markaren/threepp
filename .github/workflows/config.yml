
name: Build

on: [push, workflow_dispatch]

jobs:
  # The main Linux gate — and, since it carries the vcpkg "physx" feature, the
  # only job that builds the PhysX-backed half of the repo.
  #
  # PhysX rides along here rather than in a job of its own because it is purely
  # ADDITIVE: same compiler, same build type, same preset, it only unlocks
  # targets that CMake otherwise skips. That is what distinguishes it from the
  # sanitizer job below, which cannot share a build because it mandates
  # different flags. A separate PhysX job would have re-built the library, the
  # examples, the editor and the player identically to this one just to reach
  # the extra targets — roughly doubling the Linux cost for no extra signal.
  #
  # What the feature unlocks, none of which was compiled anywhere in CI before:
  #   * 14 test executables — the four proprioceptive sensors, every play
  #     session (physics, articulation, joint, vehicle, sensor, conveyor),
  #     SoftBody, PhysxWorld, and (via v-hacd) the convex decomposition;
  #   * 8 example directories — Physics, RobotCell, Vehicle, Drive, NorwayDrive,
  #     Shooter, FPS, Spot.
  #
  # CPU only. PhysX GPU dynamics is opt-in (PhysxWorld::Settings::enableGpuDynamics)
  # and the runners have no CUDA device; SoftBody_test asks for a GPU world, gets
  # nullptr and skips itself, which is intended behaviour rather than a hole this
  # job could close.
  linux:

    runs-on: ${{ matrix.os }}
    env:
      CC: gcc-${{ matrix.compiler_version }}
      CXX: g++-${{ matrix.compiler_version }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04 ]
        compiler_version: [ 11 ]

    steps:
      - uses: actions/checkout@v6

      # GLFW is no longer taken from apt: the manifest's "external-glfw" feature
      # supplies it, so that with the vcpkg toolchain in play there is exactly one
      # provider for every find_package rather than two whose precedence has to be
      # reasoned about. THREEPP_USE_EXTERNAL_GLFW stays ON and the code path under
      # test — find_package(glfw3 CONFIG) plus the imported target — is unchanged;
      # only who ships the library differs. The X11 dev headers stay, since that is
      # what vcpkg builds glfw3 against.
      - name: Install prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y \
          libxinerama-dev \
          libxcursor-dev \
          xorg-dev \
          libglu1-mesa-dev \
          pkg-config \
          ninja-build \
          libgl1-mesa-dri \
          xvfb

      - name: Checkout vcpkg
        run: |
          git clone --depth 1 --branch "$VCPKG_RELEASE" \
            https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
        env:
          # Pinned so the cache key is stable and a vcpkg-side regression cannot
          # land here unannounced. This release carries physx 5.5.0#1, which is
          # what the development machines build against. Bump deliberately, and
          # move the cache key below with it.
          VCPKG_RELEASE: 2026.01.16

      # Building PhysX 5.5 from source is tens of minutes; this makes that a
      # once-per-bump cost rather than a per-push one. The key moves only when
      # the vcpkg release above or the manifest changes.
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-ubuntu-22.04-2026.01.16-${{ hashFiles('vcpkg.json') }}

      # xvfb + the Mesa DRI driver are declared explicitly for the GL pixel tests
      # (tests/renderers/gl), which construct a Canvas and so need a display and a
      # software rasteriser. The runner image happens to ship both already — these
      # tests have been green without this — but relying on undeclared image
      # contents is fragile, and the python-bindings job below already installs
      # them explicitly. NB tests/renderers/gl/CMakeLists.txt looks for xvfb-run at
      # CONFIGURE time, so the install has to precede cmake either way.
      - name: Configure and build
        run: |
          cmake --preset ci-linux-physx
          cmake --build --preset ci-linux-physx

      # Fails the job if the PhysX targets did not materialise. Without this,
      # tests/extras/CMakeLists.txt would quietly take its `physx not found`
      # branch, every remaining test would pass, and the job would go green
      # having built none of what it was extended to cover.
      - name: Assert the PhysX targets were built
        run: |
          ctest --preset ci-linux-physx -N | grep -q 'EditorConveyor_test' \
            || { echo "PhysX tests absent — the vcpkg feature did not take effect"; exit 1; }

      - name: Test
        run: ctest --preset ci-linux-physx


  # AddressSanitizer + UndefinedBehaviorSanitizer.
  #
  # Its own job, so that a plain regression and a sanitizer regression are
  # reported independently rather than the first failure hiding the second.
  # The apt set and the display stack are the same as the Release job above.
  #
  # Examples are off (see the ci-linux-asan preset) — they are only ever
  # compiled, never run, so instrumenting them buys nothing and they are the
  # bulk of the build time.
  #
  # Leak detection is OFF on purpose: the GL driver, GLFW and X11 all leak
  # per-process allocations we neither own nor can free, and their reports
  # bury the ones that matter. The target is use-after-free, out-of-bounds and
  # undefined behaviour, which detect_leaks does not affect.
  linux-asan:

    runs-on: ${{ matrix.os }}
    env:
      CC: gcc-${{ matrix.compiler_version }}
      CXX: g++-${{ matrix.compiler_version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04 ]
        compiler_version: [ 11 ]

    steps:
      - uses: actions/checkout@v6

      - name: Install prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y \
          libxinerama-dev \
          libxcursor-dev \
          xorg-dev \
          libglu1-mesa-dev \
          pkg-config \
          ninja-build \
          libglfw3 \
          libglfw3-dev \
          libgl1-mesa-dri \
          xvfb

      - name: Configure and build (ASan + UBSan)
        run: |
          cmake --preset ci-linux-asan
          cmake --build --preset ci-linux-asan

      - name: Test (ASan + UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset ci-linux-asan


  linux-no-glfw:

    runs-on: ${{ matrix.os }}
    env:
      CC: gcc-${{ matrix.compiler_version }}
      CXX: g++-${{ matrix.compiler_version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04 ]
        compiler_version: [ 11 ]

    steps:
      - uses: actions/checkout@v6

      - name: Install prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y \
          libxinerama-dev \
          libxcursor-dev \
          xorg-dev \
          libglu1-mesa-dev \
          pkg-config \
          ninja-build

      - name: Configure and build
        run: |
          cmake --preset ci-linux-no-glfw
          cmake --build --preset ci-linux-no-glfw

      - name: Test
        run: ctest --preset ci-linux-no-glfw


  # Compile-only smoke test for the Vulkan deferred backend.
  # GitHub runners have no GPU, but the backend and its GLSL shaders can still be
  # *compiled*: the Vulkan loader links without a physical device, and
  # glslangValidator needs no GPU to emit SPIR-V. This guards the largest and
  # most actively-developed subsystem (VulkanRenderer.cpp + shaders) against
  # bit-rot on non-MSVC toolchains.
  #
  # It is NOT a runtime test — linux-vulkan-lavapipe below is, on a software
  # rasteriser. This job stays separate because it is fast and covers the whole
  # library, while that one builds two executables and runs them slowly; a
  # compile break should not be reported as a rendering failure.
  linux-vulkan:

    runs-on: ubuntu-22.04
    env:
      CC: gcc-11
      CXX: g++-11

    steps:
      - uses: actions/checkout@v6

      - name: Install prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y \
          libxinerama-dev \
          libxcursor-dev \
          xorg-dev \
          libglu1-mesa-dev \
          pkg-config \
          ninja-build

      - name: Install Vulkan SDK (headers, loader, current glslangValidator)
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          glslangValidator --version

      - name: Fetch Vulkan Memory Allocator header
        run: |
          mkdir -p "$GITHUB_WORKSPACE/third_party/vma"
          wget -qO "$GITHUB_WORKSPACE/third_party/vma/vk_mem_alloc.h" \
            https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/v3.1.0/include/vk_mem_alloc.h

      - name: Configure and build (library only — compile check)
        run: |
          cmake --preset ci-linux-vulkan
          cmake --build --preset ci-linux-vulkan


  # The Vulkan backend, actually RUNNING, on Mesa's lavapipe software rasteriser.
  #
  # Why this job exists: until it, CI compiled the Vulkan backend and executed
  # none of it, because the only Vulkan tests were pixel tests. Their references
  # are captured on one GPU and the ray-traced samples behind them are stochastic,
  # so they cannot be a cross-hardware gate and are excluded here (see the
  # ci-linux-vulkan-lavapipe TEST preset's filter — it selects by name).
  #
  # What CAN be gated on any conformant driver is spec-cleanliness, and that is
  # what VulkanValidation_test asserts: zero VK_LAYER_KHRONOS_validation errors
  # across a sequence of reconfigurations — AOV resolves, secondary-view
  # add/remove, render-scale and G-buffer-MSAA realloc, swapchain recreate,
  # entry-list churn. That is deliberately the defect class this project keeps
  # re-introducing: descriptors rewritten while a frame still reads them, which no
  # pixel comparison can see, which reproduces intermittently on real hardware,
  # and which the layer reports precisely and deterministically. One instance of
  # it shipped in a published wheel as a crash.
  #
  # ubuntu-24.04 for its newer Mesa: the renderer requests ray tracing
  # unconditionally (VulkanCoreImpl's ctor passes enableRayTracing=true), so
  # lavapipe must expose the RT extensions or VulkanContext throws and every test
  # skips itself. The probe step below asserts that BEFORE the tests run, and the
  # post-test check fails the job on any skip — otherwise this job's most likely
  # failure mode is going green having rendered nothing, which is exactly the trap
  # the PhysX assertion in the `linux` job above guards against.
  #
  # Under xvfb, not display-free. A headless canvas with no DISPLAY selects GLFW's
  # Null platform and then REQUIRES VK_EXT_headless_surface; with a display it
  # falls back to a hidden-window surface if the ICD lacks the extension. Running
  # under Xvfb therefore works either way, and lavapipe presenting to Xvfb is
  # unproblematic — it is a software rasteriser, so there is no GPU/X-server
  # mismatch of the kind that afflicts a real driver. (The display-free path
  # itself is still uncovered; it needs an ICD with the extension.)
  linux-vulkan-lavapipe:

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y \
          libxinerama-dev \
          libxcursor-dev \
          xorg-dev \
          libglu1-mesa-dev \
          pkg-config \
          ninja-build \
          xvfb

      # lavapipe (VK_ICD lvp) — Mesa's software Vulkan implementation. From the
      # distro rather than LunarG, which ships no ICD.
      - name: Install lavapipe
        run: sudo apt-get install -y mesa-vulkan-drivers

      # Validation layers + glslangValidator, from LunarG for the same reason as
      # the compile-check job above: the distro's glslang lags the shader features
      # in use here.
      - name: Install Vulkan SDK (validation layers, glslangValidator, vulkaninfo)
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          glslangValidator --version

      - name: Fetch Vulkan Memory Allocator header
        run: |
          mkdir -p "$GITHUB_WORKSPACE/third_party/vma"
          wget -qO "$GITHUB_WORKSPACE/third_party/vma/vk_mem_alloc.h" \
            https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/v3.1.0/include/vk_mem_alloc.h

      # The ICD manifest filename is Mesa's to choose, so resolve it by glob and
      # export it for every later step, rather than hard-pinning a path that a
      # packaging change would silently break. (The first run of this job pinned
      # the path AND ran vulkaninfo outside Xvfb; the probe then reported all
      # five extensions missing — including VK_KHR_swapchain, which lavapipe has
      # always had. An impossible capability report means a broken probe
      # environment, which is why this step now fails on enumeration explicitly
      # before saying anything about extensions.)
      - name: Locate the lavapipe ICD manifest
        run: |
          set -euo pipefail
          ls -la /usr/share/vulkan/icd.d/ || true
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)
          if [ -z "$icd" ]; then
            echo "::error::no lavapipe ICD manifest under /usr/share/vulkan/icd.d — mesa-vulkan-drivers did not provide lvp_icd*.json (listing above)."
            exit 1
          fi
          echo "using ICD manifest: $icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      # Fail here, with the driver's own extension list in the log, rather than
      # letting the tests skip themselves further down. Under xvfb-run because
      # vulkaninfo probes WSI: with no DISPLAY it can fail before enumerating
      # anything, and an enumeration failure must be reported as one — not as
      # "every extension is missing". If enumeration works and extensions ARE
      # missing, the fix is a newer Mesa (a PPA, or a newer runner image).
      - name: Probe lavapipe for the extensions the renderer requires
        run: |
          set -euo pipefail
          xvfb-run -a vulkaninfo > vulkaninfo.txt 2>&1 || true
          grep -m1 "driverInfo" vulkaninfo.txt || true
          if ! grep -q "deviceName" vulkaninfo.txt; then
            echo "::error::vulkaninfo enumerated no Vulkan device at all — the probe environment is broken (ICD manifest, loader, or display), not lavapipe's capabilities. First lines: $(head -c 400 vulkaninfo.txt | tr '\n' ' ')"
            exit 1
          fi
          missing=""
          for ext in VK_KHR_ray_tracing_pipeline \
                     VK_KHR_acceleration_structure \
                     VK_KHR_deferred_host_operations \
                     VK_KHR_buffer_device_address \
                     VK_KHR_swapchain; do
            if ! grep -q "$ext" vulkaninfo.txt; then
              missing="$missing $ext"
            fi
          done
          # Reported, not required: with a display present the renderer falls back
          # to a hidden-window surface without it.
          if grep -q VK_EXT_headless_surface vulkaninfo.txt; then
            echo "note: VK_EXT_headless_surface IS advertised (display-free rendering possible)"
          else
            echo "note: VK_EXT_headless_surface absent — the hidden-window fallback carries this job"
          fi
          if [ -n "$missing" ]; then
            echo "::error::lavapipe ($(grep -m1 driverInfo vulkaninfo.txt | sed 's/.*= //' || echo unknown)) lacks required extension(s):$missing — the renderer requests ray tracing unconditionally, so every Vulkan test would skip itself. Needs a newer Mesa."
            exit 1
          fi
          echo "lavapipe exposes every extension the renderer requires."

      - name: Configure and build (Vulkan gate executables)
        run: |
          cmake --preset ci-linux-vulkan-lavapipe
          cmake --build --preset ci-linux-vulkan-lavapipe

      # THREEPP_VULKAN_STRICT_VALIDATION makes any validation error a nonzero exit
      # for EVERY executable in the run, not just the one test that asserts on the
      # counters — so VulkanCameraModel_test is a validation gate here too, at no
      # extra cost. VulkanValidation_test sets THREEPP_VULKAN_VALIDATION itself;
      # it is set here as well so the other test is covered.
      # VK_DRIVER_FILES / VK_ICD_FILENAMES come from the ICD-locating step via
      # GITHUB_ENV — not re-declared here, where a step-level value would
      # override the resolved one.
      #
      # THREEPP_GATE_UNLIT: shading a LIT pixel on llvmpipe — which traces rays
      # into a non-empty TLAS — segfaults inside its JIT-compiled shader code
      # (Mesa 24.x–25.2.8; bisected in VulkanValidation_test.cpp, see the scene
      # comment there). Every phase's API-level lifecycle coverage — the point
      # of this gate — is identical with Basic materials, so the gate runs
      # unlit here and fully lit on real GPUs. Retest against a newer Mesa
      # before assuming this is still needed.
      - name: Run the Vulkan runtime gate
        env:
          THREEPP_VULKAN_VALIDATION: '1'
          THREEPP_VULKAN_STRICT_VALIDATION: '1'
          THREEPP_GATE_UNLIT: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" \
            ctest --preset ci-linux-vulkan-lavapipe 2>&1 | tee ctest.log

      # Reading this job's logs requires being signed in, but annotations are
      # public — so on failure, the verdict itself (which tests failed, the
      # phase table, the first distinct validation messages) is lifted out of
      # the logs and into annotations, where the commit page shows it to
      # anyone. Each message is truncated: VUID texts run to kilobytes and
      # GitHub clips long annotations anyway, but the VUID name lands well
      # inside the first 600 characters.
      - name: Surface the verdict as annotations
        if: failure()
        run: |
          testlog=build/ci-linux-vulkan-lavapipe/Testing/Temporary/LastTest.log
          if [ -f ctest.log ]; then
            grep -E '\*\*\*|Passed|Failed' ctest.log | tail -n 6 | while IFS= read -r line; do
              echo "::error::ctest: ${line}"
            done
          fi
          if [ -f "$testlog" ]; then
            grep -F '[phase]' "$testlog" | tail -n 9 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            grep -F '[Vulkan] ERROR' "$testlog" | cut -c1-600 | sort -u | head -n 5 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            grep -F 'strict validation' "$testlog" | tail -n 2 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi

      # A skip is exit 42 and CTest counts it as success. Here it means no device
      # or no validation layer — i.e. the job proved nothing — so it must fail.
      - name: Assert nothing skipped itself
        run: |
          set -euo pipefail
          if grep -q 'Skipped' ctest.log; then
            echo "::error::A Vulkan test skipped itself (exit 42) — no device or no validation layer, so this job asserted nothing."
            exit 1
          fi
          echo "Both gate tests ran for real."


  windows:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]

    steps:
      - uses: actions/checkout@v6

      # Ninja ships on the windows image but, unlike the VS generator, needs the
      # MSVC toolchain (cl.exe) on PATH. Activate the x64 developer environment.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build
        run: |
          cmake --preset ci-windows
          cmake --build --preset ci-windows

      - name: Test
        run: ctest --preset ci-windows


  darwin:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]

    steps:
      - uses: actions/checkout@v6

      # Ninja (which the ci-* presets select) comes from the runner image here —
      # unlike the Linux jobs there is no package step to declare it in. If an
      # image ever drops it, CMake fails at configure time with a missing
      # CMAKE_MAKE_PROGRAM, which is immediate and unambiguous.
      - name: Configure and build
        run: |
          cmake --preset ci-macos
          cmake --build --preset ci-macos


  linux-emscripten:

    # On master, pages.yml builds Emscripten and deploys it to GitHub Pages, so
    # skip this duplicate compile-check there. Still runs on every other branch.
    if: github.ref != 'refs/heads/master'

    runs-on: ${{ matrix.os }}
    env:
      CC: gcc-${{ matrix.compiler_version }}
      CXX: g++-${{ matrix.compiler_version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04 ]
        compiler_version: [ 11 ]

    steps:
      - uses: actions/checkout@v6

      - name: Install prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y \
          libxinerama-dev \
          libxcursor-dev \
          xorg-dev \
          libglu1-mesa-dev \
          pkg-config \
          ninja-build

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.6
          actions-cache-folder: 'emsdk-cache'

      - name: Configure and build
        run: |
          cmake --preset ci-wasm
          cmake --build --preset ci-wasm


  # Build the pybind11 Python bindings (the `threepp` module) and run the binding
  # test-suite. Like the Vulkan job, this can't exercise the GPU-only paths — the
  # PhysX direct-GPU + CUDA/torch RL stuff needs a real GPU the runners don't have —
  # so it builds GL-only: the module is compiled (catching binding breaks across the
  # matrix of Python versions) and the GL + math/scene/loader/imgui tests run on
  # Mesa's software rasteriser under a virtual display. The PhysX and Vulkan tests
  # skip themselves on a GL-only build (pytest.mark.skipif on threepp.HAS_*).
  python-bindings:

    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.12' ]

    steps:
      - uses: actions/checkout@v6

      - name: Install prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y \
          libxinerama-dev \
          libxcursor-dev \
          xorg-dev \
          libglu1-mesa-dev \
          pkg-config \
          ninja-build \
          libglfw3 \
          libglfw3-dev \
          libgl1-mesa-dri \
          xvfb

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python test deps
        run: python -m pip install --upgrade pip pytest numpy pillow

      - name: Build the threepp module (GL only — PhysX/Vulkan need a GPU)
        run: |
          cmake --preset ci-python -DPython_EXECUTABLE=$(which python)
          cmake --build --preset ci-python

      - name: Run binding tests (headless GL under Xvfb)
        working-directory: python
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python -m pytest -ra
