# Build redistributable wheels for the `threepp` and `threepp-editor` packages.
#
# Two paths:
#
#   push a date tag (YYYY-MM-DD)  -> build, PUBLISH both packages to PyPI, and
#                                    attach everything to that GitHub Release.
#                                    Version is the PEP 440 form of the tag
#                                    (2026-06-17 -> 2026.06.17).
#   workflow_dispatch             -> build, then REHEARSE the upload against
#                                    TestPyPI as <version>.dev<run_number>.
#
# A PyPI upload is IRREVERSIBLE: a filename can never be re-uploaded, even
# after deleting the release. The dispatch path exists so every change to this
# pipeline is rehearsed on TestPyPI until boring BEFORE a tag makes it real;
# a botched release recovers via the same-day suffix tag (2026-06-17-2).
#
# The wheels ship the GL renderer, CPU PhysX physics (PhysxWorld, articulations,
# proprioceptive sensors) AND the Vulkan deferred renderer with its G-buffer
# AOVs, for Linux and Windows on CPython 3.10-3.14. Vulkan degrades gracefully:
# the loader is delay-loaded on Windows and auditwheel-vendored on Linux, so the
# wheel imports everywhere and VulkanRenderer raises a clean RuntimeError on
# machines without a Vulkan runtime (threepp.vulkan_available() to probe).
# GPU physics is NOT in the wheel — PhysXGpu_64.dll is 76 MB zipped against
# PyPI's 100 MiB/file cap — so soft bodies / GpuSim / direct-GPU RL need a
# source build (the DLL is dlopen'd, so dropping it next to the module also
# works). FSR/DLSS are likewise absent (signed vendor DLLs; DLSS alone is
# 56-66 MB). macOS has no wheel on purpose — see the matrix.
#
# The EDITOR ships as its own package from build_editor_wheels: threepp-editor,
# per-interpreter Windows wheels (the exe embeds CPython). Same version, same
# publish jobs, its own trusted-publisher registrations.
name: Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - '2[0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'   # date releases, e.g. 2026-06-17
      # Same-day re-release, e.g. 2026-06-17-2. PyPI filenames are immutable —
      # a botched 2026.6.17 can never be re-uploaded, and without this pattern
      # the fastest legal fix is waiting for tomorrow's date. The version step's
      # dash-to-dot rewrite already handles it: 2026-06-17-2 -> 2026.06.17.2,
      # which PEP 440 sorts after 2026.6.17 exactly as intended. Yank the bad
      # release on PyPI, tag with the suffix, done.
      - '2[0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[0-9]'

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux + Windows only. macOS is DELIBERATELY not built here: it is the
        # slowest leg by far (it would build two arches x five interpreters, and
        # every platform gates the publish jobs below), and it can only ever run
        # the GL backend — no Vulkan without MoltenVK, which has no equivalent
        # for the ray-tracing path the deferred renderer needs, and no PhysX GPU,
        # which is CUDA. The C++ library is still compiled on every push by the
        # `darwin` job in config.yml, so the LIBRARY cannot rot unnoticed — but
        # that job does not build the Python module, so the sdist path a mac
        # user actually hits (pip install -> local compile) has NO CI coverage
        # after this change. Known trade-off, accepted 2026-08-07.
        #
        # If macOS is ever added back, it needs
        #   CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
        # or it will not compile: cibuildwheel gives the x86_64 leg a 10.9 target
        # (10.13 since 3.x), and libc++ marks std::visit and std::get<variant>
        # unavailable below 10.13 and std::filesystem::path below 10.15 — all
        # three are used by Image.hpp and Texture.hpp, so every translation unit
        # reaching them fails. 11.0 clears the whole class and matches arm64's
        # own floor. Recorded here because it cost a CI round to find.
        os: [ ubuntu-22.04, windows-2022 ]

    steps:
      - uses: actions/checkout@v6

      # On a tag: PEP 440 needs dots, not dashes (2026-06-17 -> 2026.06.17; pip
      # normalises the leading zeros).
      #
      # On dispatch: a UNIQUE .devN version per run. A fixed 0.1.0 would upload
      # to TestPyPI exactly once and every later rehearsal would be skipped as a
      # duplicate filename — a green job that tested nothing. run_number is
      # shared by every job in the run, so wheels and sdist agree on the version
      # without passing anything between them.
      #
      # Anchored to ^version so it only ever touches [project].version.
      - name: Derive the distribution version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ver="${TAG//-/.}"
          else
            base=$(sed -nE 's/^version = "([^"]+)".*/\1/p' pyproject.toml)
            ver="${base}.dev${RUN}"
          fi
          sed -i.bak -E "s/^version = \".*\"/version = \"${ver}\"/" pyproject.toml
          rm -f pyproject.toml.bak
          echo "wheel version -> ${ver}"

      # PhysX for the wheels, via vcpkg's manifest "physx" feature — the same
      # mechanism config.yml's linux job already proves out. Pinned to the same
      # vcpkg release so a port-side regression cannot land here unannounced and
      # the binary-cache key stays stable. First uncached PhysX build costs
      # ~15 min; the cache makes later runs near-free.
      # The feature list is part of the key on purpose: actions/cache does NOT
      # re-save on an exact-key hit, so growing the feature set under an old key
      # would rebuild the new ports every run while believing itself cached.
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-wheels-${{ matrix.os }}-2026.01.16-physx-vulkan-${{ hashFiles('vcpkg.json') }}

      # Windows builds on the host, so vcpkg runs as its own step here. Linux
      # builds inside the manylinux container, where the host's vcpkg would be
      # useless — its PhysX must be built IN the container (CIBW_BEFORE_ALL_LINUX
      # below), against the same glibc/toolchain as the wheel itself.
      - name: PhysX via vcpkg (host — Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 --branch 2026.01.16 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          $env:VCPKG_DEFAULT_BINARY_CACHE = "${{ github.workspace }}\vcpkg-cache"
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:RUNNER_TEMP\vcpkg\vcpkg" install --triplet x64-windows --x-feature=physx --x-feature=vulkan --x-install-root=vcpkg_installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Hand the hints to the build step with FORWARD slashes, from here
          # rather than a workflow env expression: the workspace path spelled with
          # backslashes (D:\a\threepp\threepp\vcpkg_installed\...) is full of
          # accidental escape sequences (\a, \t, \v) wherever CMake processes
          # strings, and find_package is QUIET — a corrupted hint doesn't fail
          # the build, it silently produces a GL-only wheel. That is exactly the
          # failure the smoke test caught on the first PhysX dispatch.
          #
          # Vulkan comes entirely from vcpkg (no SDK install on the runner):
          # CMAKE_PREFIX_PATH lets FindVulkan see the headers + loader lib and
          # find_path see vk_mem_alloc.h; GLSLANG_VALIDATOR points straight at
          # the tool so the shader-embed step never depends on PATH. Wrong paths
          # fail the CONFIGURE loudly — never a silently degraded wheel.
          $root = $pwd.Path -replace '\\', '/'
          $vi = "$root/vcpkg_installed/x64-windows"
          "CMAKE_ARGS=-DTHREEPP_WITH_VULKAN=ON -DCMAKE_PREFIX_PATH=$vi -DGLSLANG_VALIDATOR=$vi/tools/glslang/glslangValidator.exe -Dunofficial-omniverse-physx-sdk_DIR=$vi/share/unofficial-omniverse-physx-sdk" >> $env:GITHUB_ENV

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1
        env:
          # ONE build tree shared by all five interpreter builds, instead of
          # scikit-build-core's default per-wheel-tag dir. The ~640 threepp/imgui
          # objects depend on nothing Python-specific, so CMake's command-hash
          # tracking recompiles only the binding TUs (whose include dirs change
          # with the interpreter) and relinks — measured locally: second wheel
          # 75s vs 194s cold, with each wheel verified to link ITS OWN
          # pythonXX.dll (dumpbin) and pass the physics smoke. On Linux the
          # container path is set via CIBW_ENVIRONMENT_LINUX below; the
          # container (and so /tmp) persists across the five builds.
          SKBUILD_BUILD_DIR: ${{ runner.temp }}\skb-shared
          # scikit-build-core forwards CMAKE_ARGS to the CMake configure; it is
          # how python/CMakeLists.txt finds PhysX without the vcpkg toolchain
          # file (find_package is QUIET-optional, so an sdist user without vcpkg
          # still builds — GL-only, exactly as before). On Windows the variable
          # arrives via $GITHUB_ENV from the vcpkg step above; on Linux the path
          # must be valid INSIDE the container, so CIBW_ENVIRONMENT_LINUX below
          # sets it there.
          #
          # cibuildwheel 4.x runs `delvewheel repair` on Windows BY DEFAULT (2.x
          # ran nothing). delvewheel resolves the .pyd's imports from PATH and
          # errors on the PhysX DLLs ("Unable to find library: physx_64.dll") —
          # it does not accept the copies already inside the wheel, and vcpkg's
          # bin is not on PATH. We vendor those four DLLs deliberately via
          # install() rules (license file beside them, GPU pair excluded), so
          # repair is disabled rather than taught to duplicate the job. If wheels
          # ever need to carry msvcp140 for machines without the VC++ redist,
          # re-enable delvewheel WITH --add-path to the vcpkg bin and drop the
          # install() rules in the same change — not piecemeal.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""
          # CPython 3.10–3.14. cibuildwheel 4.0 is where 3.14 became a default
          # build target (3.x needed a prerelease opt-in), so 4.x is the floor.
          # Pinned to 4.1.1 rather than the newest 4.2.0 only because 4.2.0 is
          # days old and this workflow has yet to go green once.
          #
          # CIBW_BUILD is an explicit ALLOWLIST, which is what keeps the bump
          # safe: 4.2.0 builds CPython 3.15 by default and 4.x offers
          # free-threaded builds as standard, but neither can leak in here.
          # `cp314-*` does not match the free-threaded id `cp314t-*` — the glob
          # sees `t` where it wants `-` — so no untested no-GIL wheel appears.
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          # Redundant since 3.0 (PyPy and 32-bit Linux are no longer default,
          # and musllinux/win32 were never selected by CIBW_BUILD above), but
          # kept as a belt on the allowlist's braces. `pp*` is gone: 4.x warns
          # that a selector for a non-enabled group is invalid.
          CIBW_SKIP: "*-musllinux* *_i686 *-win32"
          # C++20 needs a recent toolchain; AlmaLinux 8 (manylinux_2_28) ships GCC 12.
          # This is cibuildwheel's own default since 3.0, so the pin is now
          # documentation rather than configuration — kept because the GCC version
          # is a hard requirement here, not a preference.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # The vendored GLFW needs the X11/GL dev headers to compile on Linux.
          #
          # libxcb-devel + wayland-devel + pkgconfig are for the VULKAN LOADER,
          # not for GLFW: vcpkg's vulkan-loader port exposes the loader's
          # BUILD_WSI_* switches as opt-in features (now requested in vcpkg.json),
          # and each one needs its platform headers — xcb and x11 are located
          # through pkg-config, wayland by include alone. Without them the loader
          # builds WSI-less and FILTERS every VK_KHR_*_surface extension out of
          # vkEnumerateInstanceExtensionProperties, which is exactly what shipped
          # in 2026.8.9. The repair step below fails the build if this regresses.
          #
          # Then PhysX, built inside the container by a pinned vcpkg: the
          # x64-linux triplet is static, so the .a links straight into the
          # module — nothing extra for auditwheel to graft, and the wheel stays
          # self-contained. Runs ONCE per job (cibuildwheel keeps one container
          # for all five interpreters). The binary cache lives on the host via
          # the /host mount, so actions/cache above covers this too.
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y libX11-devel libXrandr-devel libXinerama-devel
            libXcursor-devel libXi-devel mesa-libGL-devel libxcb-devel
            wayland-devel pkgconfig zip unzip tar &&
            git clone --depth 1 --branch 2026.01.16 https://github.com/microsoft/vcpkg.git /opt/vcpkg &&
            /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics &&
            export VCPKG_DEFAULT_BINARY_CACHE=/host${{ github.workspace }}/vcpkg-cache &&
            mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" &&
            cd /project &&
            /opt/vcpkg/vcpkg install --triplet x64-linux --x-feature=physx --x-feature=vulkan
            --x-install-root=/opt/vcpkg_installed
          # Vulkan on Linux needs no delay-load: the loader is a normal link
          # dependency, auditwheel vendors libvulkan.so.1 into the wheel, and a
          # machine without a GPU/ICD fails at VulkanRenderer construction with
          # a catchable RuntimeError — import always works.
          #
          # LD_LIBRARY_PATH is FOR AUDITWHEEL: the module's DT_NEEDED says just
          # "libvulkan.so.1", and auditwheel resolves that against the ld search
          # path — the vcpkg lib dir isn't on it, so without this the repair
          # dies with "required library could not be located" instead of
          # vendoring the loader.
          CIBW_ENVIRONMENT_LINUX: >
            CMAKE_ARGS="-DTHREEPP_WITH_VULKAN=ON
            -DCMAKE_PREFIX_PATH=/opt/vcpkg_installed/x64-linux
            -DGLSLANG_VALIDATOR=/opt/vcpkg_installed/x64-linux/tools/glslang/glslangValidator
            -Dunofficial-omniverse-physx-sdk_DIR=/opt/vcpkg_installed/x64-linux/share/unofficial-omniverse-physx-sdk"
            SKBUILD_BUILD_DIR="/tmp/skb-shared"
            LD_LIBRARY_PATH="/opt/vcpkg_installed/x64-linux/lib"
          # GLFW links the system X11/GL libs; keep them external (the user's system
          # / GPU driver provides them) instead of bundling them into the wheel.
          #
          # Then patch_linux_wheel_loader.py, which undoes ONE thing auditwheel
          # does: the hash-mangling of the vendored Vulkan loader's filename.
          # GLFW dlopen()s the loader by soname rather than linking it, so under a
          # mangled name it silently picks up the SYSTEM loader while the module
          # uses the bundled one — two loaders, and a VkInstance from one handed
          # to the other. The script restores libvulkan.so.1, repoints DT_NEEDED,
          # and then ASSERTS the loader exports vkCreateXlibSurfaceKHR /
          # XcbSurfaceKHR / WaylandSurfaceKHR, which is the only honest test that
          # the WSI features took effect (the extension name strings are in the
          # binary either way). A WSI-less loader fails the job here instead of
          # shipping.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair -w {dest_dir} {wheel}
            --exclude libGL.so.1 --exclude libGLX.so.0 --exclude libOpenGL.so.0
            --exclude libEGL.so.1 --exclude libX11.so.6 --exclude libXrandr.so.2
            --exclude libXinerama.so.1 --exclude libXcursor.so.1 --exclude libXi.so.6
            --exclude libXext.so.6 --exclude libxcb.so.1 &&
            python /project/python/scripts/patch_linux_wheel_loader.py {dest_dir}
          # Smoke-test where there's a usable runtime: import, ASSERT the wheel
          # has ImGui and PhysX (a silently failed vcpkg step must fail the job,
          # not ship a physics-less wheel), and run one second of CPU physics —
          # headless by design, so it runs fine on a display-less runner. The
          # manylinux container has no GL driver and the X11 libs are
          # intentionally external, so skip there (the wheel still works on a
          # real Linux desktop).
          CIBW_TEST_COMMAND: 'python {project}/python/scripts/wheel_smoke.py'
          CIBW_TEST_SKIP: "*-manylinux*"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # The editor as its own per-interpreter wheels (threepp-editor). Windows only:
  # the exe embeds CPython, and executables linking libpython sit outside
  # manylinux practice — Linux editor wheels stay a research question, documented
  # in editor-wheel/. GL viewport by decree (editor-wheel/CMakeLists FORCEs
  # Vulkan off), CPU PhysX via the same vcpkg mechanism as the module wheels.
  build_editor_wheels:
    name: Editor wheels (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      # Same version logic as the module wheels, applied to the editor's own
      # pyproject — run_number keeps the two packages' versions in lockstep.
      - name: Derive the distribution version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ver="${TAG//-/.}"
          else
            base=$(sed -nE 's/^version = "([^"]+)".*/\1/p' editor-wheel/pyproject.toml)
            ver="${base}.dev${RUN}"
          fi
          sed -i.bak -E "s/^version = \".*\"/version = \"${ver}\"/" editor-wheel/pyproject.toml
          rm -f editor-wheel/pyproject.toml.bak
          echo "editor wheel version -> ${ver}"

      # Same cache key as build_wheels: the binary cache is per-port archives,
      # so this job's physx-only install hits the archives the other job built.
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-wheels-windows-2022-2026.01.16-physx-vulkan-${{ hashFiles('vcpkg.json') }}

      - name: PhysX via vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 --branch 2026.01.16 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          $env:VCPKG_DEFAULT_BINARY_CACHE = "${{ github.workspace }}\vcpkg-cache"
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:RUNNER_TEMP\vcpkg\vcpkg" install --triplet x64-windows --x-feature=physx --x-install-root=vcpkg_installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Forward slashes, via GITHUB_ENV, no vulkan flags — the editor build
          # is GL-only and its CMakeLists FORCEs Vulkan off besides.
          #
          # CMAKE_PREFIX_PATH is NOT redundant beside the physx-sdk _DIR: the
          # _DIR navigates find_package straight to PhysX's config and nothing
          # else, while find_path(VHACD.h) — convex decomposition, installed by
          # the SAME vcpkg feature — searches the prefix path. Without it the
          # editor wheel shipped "VHACD.h not found, convex decomposition
          # disabled" while the header sat in vcpkg_installed all along.
          $root = $pwd.Path -replace '\\', '/'
          $vi = "$root/vcpkg_installed/x64-windows"
          "CMAKE_ARGS=-DCMAKE_PREFIX_PATH=$vi -Dunofficial-omniverse-physx-sdk_DIR=$vi/share/unofficial-omniverse-physx-sdk" >> $env:GITHUB_ENV

      - name: Build editor wheels
        uses: pypa/cibuildwheel@v4.1.1
        with:
          package-dir: editor-wheel
        env:
          SKBUILD_BUILD_DIR: ${{ runner.temp }}\skb-editor
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux* *_i686 *-win32"
          # Same reasoning as the module wheels: we vendor the PhysX DLLs
          # deliberately; delvewheel would fail resolving them from PATH.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: ""
          # --help prints usage and exits 0 BEFORE any window or GL context is
          # created (main.cpp returns straight after the usage text), so this
          # runs on the display-less runner. It still exercises the whole
          # delivery chain: console script -> launcher env priming -> exe
          # launch -> python3XX.dll resolution -> argument parsing.
          CIBW_TEST_COMMAND: "threepp-editor --help"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-editor-windows
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      # Must stay byte-for-byte equivalent to the wheel job's version logic, or
      # the sdist and the wheels in one run disagree and PyPI rejects the set.
      - name: Derive the distribution version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ver="${TAG//-/.}"
          else
            base=$(sed -nE 's/^version = "([^"]+)".*/\1/p' pyproject.toml)
            ver="${base}.dev${RUN}"
          fi
          sed -i.bak -E "s/^version = \".*\"/version = \"${ver}\"/" pyproject.toml
          rm -f pyproject.toml.bak
          echo "sdist version -> ${ver}"
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Rehearses the real upload against TestPyPI, on DISPATCH ONLY — so the path
  # that will one day publish to PyPI is exercised without a tag and without
  # touching the real index. Deliberately not gated on the tag: a tag run is a
  # release, and a release should not also be a rehearsal.
  #
  # Authenticated by OIDC (trusted publishing), so there is no token and no
  # secret. This needs a PENDING PUBLISHER registered at test.pypi.org — a
  # separate account and separate registration from PyPI's — whose owner /
  # repository / workflow filename / environment must match this job exactly:
  #   markaren / threepp / wheels.yml / testpypi
  publish_testpypi:
    name: Rehearse the upload on TestPyPI
    # One publish step serves BOTH projects: the artifacts merge into one dist/
    # and the OIDC identity (this workflow + the testpypi environment) is
    # registered as trusted publisher for threepp AND threepp-editor.
    needs: [ build_wheels, build_editor_wheels, build_sdist ]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: testpypi
    permissions:
      id-token: write        # the OIDC token; nothing else is needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true   # every wheels-<os> artifact plus the sdist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # The .devN version above already makes each run unique; this only
          # covers a re-run of the SAME run, which would otherwise 400.
          skip-existing: true

  # The real thing. Everything this job does was rehearsed on TestPyPI first:
  # same artifacts, same merge, same action, same OIDC exchange — only the index
  # differs. Tag-gated, and behind the `pypi` environment so repository-side
  # protection rules (required reviewers, if configured) gate the upload.
  #
  # One step publishes BOTH projects: the trusted-publisher identity (this
  # workflow) is registered for threepp (environment: pypi) and threepp-editor
  # (no environment constraint = wildcard; tighten to `pypi` in the project's
  # publishing settings after its first release exists — pending publishers
  # cannot share an identical identity tuple, which is why it started env-less).
  #
  # Deliberately NO skip-existing: versions derive from the tag, so a duplicate
  # filename here means something is genuinely wrong (a re-run of a consumed
  # tag) and must fail loudly — recovery is the suffix tag, never overwrite.
  publish_pypi:
    name: Publish to PyPI
    needs: [ build_wheels, build_editor_wheels, build_sdist ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/2')
    environment: pypi
    permissions:
      id-token: write        # OIDC trusted publishing — no token, no secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Attach wheels to the GitHub Release
    needs: [ build_wheels, build_editor_wheels, build_sdist ]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/2')   # the date tag that triggered the run
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Attaches the wheels + sdist to the existing release for this tag, leaving
      # its title / notes / pre-release flag untouched.
      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
