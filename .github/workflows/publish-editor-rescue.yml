# One-shot rescue: publish ONLY threepp-editor for an already-released tag.
#
# Exists because the 2026-08-08 run uploaded threepp and then failed on
# threepp-editor (no matching trusted publisher), and the main publish job
# cannot simply be re-run: it has no skip-existing (deliberately), so the
# already-uploaded threepp files fail the step before the editor files are
# reached. This job downloads the editor wheels from the tag's GitHub Release —
# the same bytes the failed run attached there — and publishes just those.
#
# Its OIDC identity is THIS filename, so the pending publisher for
# threepp-editor on pypi.org must name it:
#   markaren / threepp / publish-editor-rescue.yml / environment: pypi
#
# After the rescue: in the threepp-editor project's publishing settings, add
# wheels.yml (environment: pypi) as the publisher for future releases, remove
# this file's registration, and delete this file. It is not part of the
# release train — a dispatch-only tool that should not outlive its incident.
name: Rescue-publish threepp-editor

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag whose threepp_editor wheels to publish (e.g. 2026-08-08)"
        required: true

jobs:
  publish_editor:
    name: Publish threepp-editor from the release assets
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC trusted publishing — no token, no secret
      contents: read         # gh release download
    steps:
      - name: Download the editor wheels from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'threepp_editor-*' --dir dist
          ls -l dist
          # Refuse to publish an empty or mixed set: exactly the editor wheels.
          test "$(ls dist | wc -l)" -gt 0
          ! ls dist | grep -v '^threepp_editor-'
      - uses: pypa/gh-action-pypi-publish@release/v1
